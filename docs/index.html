<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дерево публичных пиров Yggdrasil</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b1220; color: #cbd5e1;
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         overscroll-behavior: none; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
           padding: 10px 16px; border-bottom: 1px solid #1e293b; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; color: #e2e8f0; }
  #meta { font-size: 12px; color: #64748b; }
  #meta .legend { margin-left: 10px; white-space: nowrap; }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
        margin: 0 4px 0 8px; vertical-align: baseline; }
  #refresh { margin-left: auto; background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
             border-radius: 6px; padding: 4px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  #refresh:hover { background: #334155; }
  #controls { position: fixed; right: 12px; bottom: 12px; z-index: 15;
              display: flex; flex-direction: column; gap: 6px; }
  #controls button { width: 38px; height: 38px; border-radius: 8px;
                     background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
                     font: 600 18px/1 system-ui, sans-serif; cursor: pointer; }
  #controls button:hover { background: #334155; }
  #wrap { position: relative; }
  svg { display: block; width: 100vw; height: calc(100vh - 43px); cursor: grab;
        touch-action: none; /* жесты обрабатываем сами: пинч-зум и пан */
        user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  svg.panning { cursor: grabbing; }
  .edge { stroke: #334155; stroke-width: 1.2; fill: none; }
  circle.node { cursor: pointer; }
  circle.dot   { fill: #64748b; }
  circle.peer  { fill: #38bdf8; }
  circle.rootn { fill: #fbbf24; }
  text.lbl      { fill: #94a3b8; font-size: 11px; font-family: ui-monospace, monospace; }
  text.lbl.peer { fill: #7dd3fc; cursor: pointer; }
  text.lbl.rootn{ fill: #fde68a; cursor: pointer; }
  #tip { position: fixed; display: none; z-index: 10; pointer-events: none;
         background: #0f172a; border: 1px solid #334155; border-radius: 6px;
         padding: 4px 8px; font-size: 12px; white-space: pre; }
  #card { position: fixed; display: none; z-index: 20;
          background: #0f172a; border: 1px solid #334155; border-radius: 8px;
          padding: 10px 12px; font-size: 12px; max-width: 360px;
          max-height: 70vh; overflow-y: auto;
          box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }
  #card h3 { margin: 0 0 6px; font: 600 12px ui-monospace, monospace;
             color: #7dd3fc; word-break: break-all; }
  #card .v6 { color: #e2e8f0; font-family: ui-monospace, monospace; word-break: break-all; }
  #card ul { margin: 6px 0 0; padding: 0; list-style: none; }
  #card li { font-family: ui-monospace, monospace; color: #94a3b8;
             padding: 2px 0; word-break: break-all; }
  #card .err { color: #f87171; }
  #err { color: #f87171; }
</style>
</head>
<body>
<header>
  <h1>Дерево публичных пиров Yggdrasil</h1>
  <div id="meta">загрузка…</div>
  <button id="refresh" title="Обновить данные сейчас">Обновить</button>
</header>
<div id="wrap"><svg id="tree" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="controls">
  <button id="zin" type="button" title="Приблизить">+</button>
  <button id="zout" type="button" title="Отдалить">&minus;</button>
  <button id="zfit" type="button" title="Вписать в экран">⤢</button>
</div>
<div id="tip"></div>
<div id="card"></div>

<script>
"use strict";

// Единственное место, которое надо поправить при смене деплоя API.
const API_URL = "https://ymonitor-api.drucyber.workers.dev";
const REFRESH_MS = 5 * 60 * 1000; // автообновление данных

const svg = document.getElementById("tree");
const metaEl = document.getElementById("meta");
const tipEl = document.getElementById("tip");

// ---------- данные ----------

async function load() {
  const res = await fetch(API_URL + "/v1/tree", { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

// Строим дерево из координат: каждый префикс любой coords — узел;
// родитель "1.2.3" — "1.2"; "" — корень. Полный coords пира = его узел.
function buildNodes(peers) {
  const nodes = new Map();
  const ensure = (id, depth) => {
    let n = nodes.get(id);
    if (!n) { n = { id, depth, children: new Map(), peer: null, x: 0, y: 0 }; nodes.set(id, n); }
    return n;
  };
  ensure("", 0);
  for (const p of peers) {
    const parts = p.coords === "" ? [] : p.coords.split(".");
    let parent = nodes.get("");
    for (let i = 0; i < parts.length; i++) {
      const id = parts.slice(0, i + 1).join(".");
      const node = ensure(id, i + 1);
      parent.children.set(id, node);
      parent = node;
    }
    parent.peer = p;
  }
  const last = id => id === "" ? -1 : parseInt(id.slice(id.lastIndexOf(".") + 1), 10);
  for (const n of nodes.values()) {
    n.children = [...n.children.values()].sort((a, b) => last(a.id) - last(b.id));
  }
  return nodes;
}

// Простая tidy-раскладка: листья через равные промежутки,
// родитель по центру своих детей, уровень = глубина.
function layout(nodes) {
  const ROW = 26, COL = 160;
  let leaf = 0;
  const walk = n => {
    if (n.children.length === 0) n.y = leaf++ * ROW;
    else {
      for (const c of n.children) walk(c);
      n.y = (n.children[0].y + n.children[n.children.length - 1].y) / 2;
    }
    n.x = n.depth * COL;
  };
  walk(nodes.get(""));
  return { ROW, COL };
}

// ---------- отрисовка ----------

let vb = null;        // текущий viewBox {x,y,w,h}
let lastNodes = null; // для двойного клика/тапа — вписать дерево в экран

function kind(n) { return n.id === "" ? "rootn" : (n.peer ? "peer" : "dot"); }

function render(d) {
  const nodes = buildNodes(d.peers);
  layout(nodes);

  let edges = "", circles = "", labels = "";
  for (const n of nodes.values()) {
    const r = n.id === "" ? 6 : (n.peer ? 5 : 3.5);
    for (const c of n.children) {
      const midX = (n.x + c.x) / 2;
      edges += `<path class="edge" d="M ${n.x + r} ${n.y} H ${midX} V ${c.y} H ${c.x - (c.id === "" ? 6 : c.peer ? 5 : 3.5)}"/>`;
    }
    const k = kind(n);
    circles += `<circle class="node ${k}" data-id="${n.id}" data-key="${n.peer ? n.peer.key : ""}" cx="${n.x}" cy="${n.y}" r="${r}"/>`;
    labels += `<text class="lbl ${k}" data-id="${n.id}" data-key="${n.peer ? n.peer.key : ""}" x="${n.x + r + 6}" y="${n.y + 3.5}">${n.id === "" ? "&quot;&quot;" : n.id}</text>`;
  }
  svg.innerHTML = edges + circles + labels;

  const list = [...nodes.values()];
  const peerCount = d.peers.length;
  const dotCount = list.length - list.filter(n => n.peer).length;
  const maxDepth = Math.max(...list.map(n => n.depth));
  const ageMin = Math.max(0, Math.round((Date.now() / 1000 - d.as_of) / 60));
  metaEl.innerHTML =
    `<b>${peerCount}</b> пиров · ${dotCount} точек · глубина ${maxDepth}` +
    ` · данные на ${new Date(d.as_of * 1000).toLocaleTimeString("ru-RU")} (${ageMin} мин назад)` +
    `<span class="legend"><i class="sw" style="background:#fbbf24"></i>корень` +
    `<i class="sw" style="background:#38bdf8"></i>публичный пир` +
    `<i class="sw" style="background:#64748b"></i>точка</span>`;
  lastNodes = list;
  fit(list);
}

function fit(nodes) {
  const pad = 40;
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  vb = {
    x: Math.min(...xs) - pad,
    y: Math.min(...ys) - pad,
    w: Math.max(...xs) - Math.min(...xs) + pad * 2,
    h: Math.max(...ys) - Math.min(...ys) + pad * 2,
  };
  apply();
}

function apply() {
  if (vb) svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
}

// координаты точки окна в системе SVG
function svgPoint(x, y) {
  const pt = svg.createSVGPoint();
  pt.x = x; pt.y = y;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

// зум в k раз вокруг точки (cx, cy) в координатах окна
function zoomAt(cx, cy, k) {
  const p = svgPoint(cx, cy);
  vb = { x: p.x - (p.x - vb.x) * k, y: p.y - (p.y - vb.y) * k, w: vb.w * k, h: vb.h * k };
  apply();
}

function panBy(dx, dy) { // сдвиг в пикселях окна
  const rect = svg.getBoundingClientRect();
  vb = { ...vb, x: vb.x - dx * (vb.w / rect.width), y: vb.y - dy * (vb.h / rect.height) };
  apply();
}

svg.addEventListener("wheel", e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1 / 1.15 : 1.15);
}, { passive: false });

// Мультитач: один указатель — пан, два — пинч-зум (+ пан серединой).
// touch-action:none на svg не даёт браузеру перехватывать жесты.
const pointers = new Map(); // pointerId -> {x,y}
let panStart = null, pinchPrev = null, dragged = false;

function pinchInfo() {
  const [a, b] = [...pointers.values()];
  return { dist: Math.hypot(a.x - b.x, a.y - b.y) || 1,
           mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 } };
}

svg.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  dragged = false;
  svg.classList.add("panning");
  if (pointers.size === 1) {
    panStart = { x: e.clientX, y: e.clientY, vb: { ...vb } };
    pinchPrev = null;
  } else if (pointers.size === 2) {
    panStart = null;
    pinchPrev = pinchInfo();
  }
});

window.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1 && panStart) {
    const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) dragged = true;
    const rect = svg.getBoundingClientRect();
    vb = { ...panStart.vb,
           x: panStart.vb.x - dx * (panStart.vb.w / rect.width),
           y: panStart.vb.y - dy * (panStart.vb.h / rect.height) };
    apply();
  } else if (pointers.size >= 2 && pinchPrev) {
    const cur = pinchInfo();
    const k = pinchPrev.dist / cur.dist; // растяжение пальцев = приближение
    if (Math.abs(k - 1) > 0.001) zoomAt(cur.mid.x, cur.mid.y, k);
    panBy(cur.mid.x - pinchPrev.mid.x, cur.mid.y - pinchPrev.mid.y);
    if (Math.abs(k - 1) > 0.01) dragged = true;
    pinchPrev = cur;
  }
});

function releasePointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    svg.classList.remove("panning");
  } else if (pointers.size === 1) {
    // жест закончился: оставшийся палец начинает новый пан
    const [p] = [...pointers.values()];
    panStart = { x: p.x, y: p.y, vb: { ...vb } };
    pinchPrev = null;
  }
}
window.addEventListener("pointerup", releasePointer);
window.addEventListener("pointercancel", releasePointer);

// двойной клик/тап — вписать дерево в экран
svg.addEventListener("dblclick", () => { if (lastNodes) fit(lastNodes); });

// кнопки зума: вокруг центра окна
document.getElementById("zin").addEventListener("click", () =>
  zoomAt(window.innerWidth / 2, window.innerHeight / 2, 1 / 1.3));
document.getElementById("zout").addEventListener("click", () =>
  zoomAt(window.innerWidth / 2, window.innerHeight / 2, 1.3));
document.getElementById("zfit").addEventListener("click", () => { if (lastNodes) fit(lastNodes); });

// тултип: только координаты и тип узла (скрываем во время жестов)
svg.addEventListener("pointermove", e => {
  const t = e.target.closest("circle.node");
  if (!t || pointers.size > 0) { tipEl.style.display = "none"; return; }
  tipEl.textContent = `${t.dataset.id === "" ? '""' : t.dataset.id} — ` +
    (t.classList.contains("rootn") ? "корень" : t.classList.contains("peer") ? "публичный пир" : "точка");
  tipEl.style.display = "block";
  tipEl.style.left = e.clientX + 14 + "px";
  tipEl.style.top = e.clientY + 14 + "px";
});
svg.addEventListener("pointerleave", () => tipEl.style.display = "none");

// ---------- карточка пира по клику ----------

const cardEl = document.getElementById("card");

function hideCard() { cardEl.style.display = "none"; }

// карточка держится внутри экрана (на мобилке — во всю ширину с отступами)
function placeCard(x, y) {
  cardEl.style.display = "block";
  const w = Math.min(360, window.innerWidth - 16);
  cardEl.style.maxWidth = w + "px";
  const left = Math.max(8, Math.min(x + 14, window.innerWidth - w - 8));
  const top = Math.max(8, Math.min(y + 14, window.innerHeight - cardEl.offsetHeight - 8));
  cardEl.style.left = left + "px";
  cardEl.style.top = top + "px";
}

async function showCard(key, coords, x, y) {
  placeCard(x, y);
  cardEl.innerHTML = `<h3>${coords === "" ? '""' : coords}</h3><div class="v6">загрузка…</div>`;
  placeCard(x, y);
  try {
    const res = await fetch(API_URL + "/v1/peers/" + key, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const p = await res.json();
    cardEl.innerHTML =
      `<h3>${p.coords === "" || p.coords == null ? '""' : p.coords}</h3>` +
      `<div class="v6">${p.ipv6}</div>` +
      `<ul>${(p.endpoints || []).map(u => `<li>${u}</li>`).join("")}</ul>`;
  } catch (err) {
    cardEl.innerHTML = `<h3>${coords === "" ? '""' : coords}</h3>` +
      `<div class="err">ошибка: ${err.message}</div>`;
  }
  placeCard(x, y); // содержимое изменило высоту — переклампить
}

// детали открываются и по точке, и по подписи координат
svg.addEventListener("click", e => {
  const t = e.target.closest("circle.node, text.lbl");
  if (!t || dragged) return;         // клик после перетаскивания игнорируем
  if (!t.dataset.key) { hideCard(); return; } // анонимная точка — данных нет
  showCard(t.dataset.key, t.dataset.id, e.clientX, e.clientY);
});

document.addEventListener("click", e => {
  if (!e.target.closest("#card") && !e.target.closest("#controls") &&
      !e.target.closest("circle.node") && !e.target.closest("text.lbl")) hideCard();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") hideCard(); });

// ---------- жизненный цикл ----------

async function refresh() {
  try {
    render(await load());
  } catch (err) {
    metaEl.innerHTML = `<span id="err">ошибка загрузки: ${err.message}</span>`;
  }
}

document.getElementById("refresh").addEventListener("click", refresh);
refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
