<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дерево публичных пиров Yggdrasil</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #0b1220; color: #cbd5e1;
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         overscroll-behavior: none;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
           padding: 8px 14px; border-bottom: 1px solid #1e293b; flex: none; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; color: #e2e8f0; white-space: nowrap; }
  #meta { font-size: 12px; color: #64748b; flex: 1 1 240px; min-width: 200px; }
  #meta b { color: #cbd5e1; }
  .opt { display: inline-flex; align-items: center; gap: 4px; font-size: 12px;
         color: #94a3b8; cursor: pointer; user-select: none; white-space: nowrap; }
  .opt input { accent-color: #38bdf8; }
  #search { position: relative; flex: 0 1 340px; min-width: 200px; }
  #q { width: 100%; background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
       border-radius: 6px; padding: 5px 10px; font: 12px ui-monospace, monospace; }
  #q:focus { outline: 1px solid #38bdf8; }
  #results { position: absolute; top: 110%; left: 0; right: 0; z-index: 30; display: none;
             background: #0f172a; border: 1px solid #334155; border-radius: 8px;
             max-height: 300px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  #results div { padding: 5px 10px; font: 12px ui-monospace, monospace; cursor: pointer;
                 color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #results div:hover { background: #1e293b; color: #e2e8f0; }
  #results .tag { color: #38bdf8; margin-right: 6px; }
  #refresh { background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
             border-radius: 6px; padding: 4px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  #refresh:hover { background: #334155; }
  #wrap { position: relative; flex: 1 1 auto; min-height: 0; }
  svg#tree { display: block; width: 100%; height: 100%; cursor: grab;
             touch-action: none; user-select: none; -webkit-user-select: none;
             -webkit-tap-highlight-color: transparent; }
  svg#tree.panning { cursor: grabbing; }
  .edge { stroke: #334155; stroke-width: 1.2; fill: none; }
  circle.node { cursor: pointer; }
  circle.dot    { fill: #64748b; }
  circle.peer   { fill: #38bdf8; }
  circle.peerc  { fill: #fb923c; }  /* координаты изменились с прошлого ts */
  circle.rootn  { fill: #fbbf24; }
  text.flagnode { font-size: 15px; text-anchor: middle; cursor: pointer; }
  text.lbl       { fill: #94a3b8; font-size: 11px; font-family: ui-monospace, monospace; }
  text.lbl.peer  { fill: #7dd3fc; cursor: pointer; }
  text.lbl.peerc { fill: #fdba74; cursor: pointer; }
  text.lbl.rootn { fill: #fde68a; cursor: pointer; }
  circle.hl { fill: none; stroke: #f87171; stroke-width: 2.5;
              animation: hlpulse 1s ease-in-out infinite; }
  @keyframes hlpulse { 50% { stroke-opacity: .25; } }
  #controls { position: fixed; right: 12px; bottom: 104px; z-index: 15;
              display: flex; flex-direction: column; gap: 6px; }
  #controls button { width: 38px; height: 38px; border-radius: 8px;
                     background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
                     font: 600 18px/1 system-ui, sans-serif; cursor: pointer; }
  #controls button:hover { background: #334155; }
  #tl { flex: none; display: flex; align-items: stretch; gap: 8px;
        padding: 6px 10px 8px; border-top: 1px solid #1e293b; }
  #tl button { background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
               border-radius: 6px; padding: 0 10px; font: inherit; cursor: pointer; }
  #tl button:hover { background: #334155; }
  #tl button:disabled { opacity: .35; cursor: default; }
  #tlchart { flex: 1 1 auto; position: relative; min-width: 0; cursor: pointer; }
  svg#tlsvg { display: block; width: 100%; height: 64px; }
  #tip { position: fixed; display: none; z-index: 40; pointer-events: none;
         background: #0f172a; border: 1px solid #334155; border-radius: 6px;
         padding: 4px 8px; font-size: 12px; white-space: pre; }
  #card { position: fixed; display: none; z-index: 20;
          background: #0f172a; border: 1px solid #334155; border-radius: 8px;
          padding: 10px 12px; font-size: 12px; max-width: 360px;
          max-height: 70vh; overflow-y: auto;
          box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }
  #card h3 { margin: 0 0 6px; font: 600 12px ui-monospace, monospace;
             color: #7dd3fc; word-break: break-all; }
  #card .v6 { color: #e2e8f0; font-family: ui-monospace, monospace; word-break: break-all; }
  #card .pk { color: #64748b; font-family: ui-monospace, monospace; font-size: 11px;
              word-break: break-all; margin-top: 2px; }
  #card .cty { color: #fde68a; }
  #card ul { margin: 6px 0 0; padding: 0; list-style: none; }
  #card li { font-family: ui-monospace, monospace; color: #94a3b8;
             padding: 2px 0; word-break: break-all; }
  #card .err { color: #f87171; }
  #err { color: #f87171; }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
        margin: 0 4px 0 8px; vertical-align: baseline; }
</style>
</head>
<body>
<header>
  <h1 id="h1">Дерево публичных пиров Yggdrasil</h1>
  <div id="meta">загрузка…</div>
  <label class="opt" id="lbl-diff-box" title="Подсветить пиры, сменившие координаты с предыдущего состояния">
    <input type="checkbox" id="opt-diff"> <span id="lbl-diff">изменения</span>
  </label>
  <label class="opt" id="lbl-flags-box" title="Показывать флаг страны вместо точки пира">
    <input type="checkbox" id="opt-flags" checked> <span id="lbl-flags">флаги</span>
  </label>
  <div id="search">
    <input id="q" type="search" placeholder="поиск"
           autocomplete="off" spellcheck="false">
    <div id="results"></div>
  </div>
  <button id="lang" type="button" title="Switch language">EN</button>
  <button id="refresh" title="Обновить данные сейчас">Обновить</button>
</header>
<div id="wrap"><svg id="tree" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="controls">
  <button id="zin" type="button" title="Приблизить">+</button>
  <button id="zout" type="button" title="Отдалить">&minus;</button>
  <button id="zfit" type="button" title="Вписать в экран">⤢</button>
</div>
<div id="tl">
  <button id="prev" type="button" title="Предыдущее состояние (←)">◀</button>
  <div id="tlchart"><svg id="tlsvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <button id="next" type="button" title="Следующее состояние (→)">▶</button>
  <button id="golive" type="button" title="К текущему состоянию">сейчас</button>
</div>
<div id="tip"></div>
<div id="card"></div>

<script>
"use strict";

// Единственное место, которое надо поправить при смене деплоя API.
const API_URL = "https://ymonitor-api.drucyber.workers.dev";
const REFRESH_MS = 5 * 60 * 1000; // автообновление данных

const svg = document.getElementById("tree");
const metaEl = document.getElementById("meta");
const tipEl = document.getElementById("tip");
const cardEl = document.getElementById("card");
const tlsvg = document.getElementById("tlsvg");

// страна (из public-peers) -> ISO-код для флага
const ISO = {
  "Armenia":"AM","Australia":"AU","Austria":"AT","Brazil":"BR","Canada":"CA",
  "Chile":"CL","Czechia":"CZ","Estonia":"EE","Finland":"FI","France":"FR",
  "Germany":"DE","Hong Kong":"HK","Hungary":"HU","India":"IN","Indonesia":"ID",
  "Japan":"JP","Kazakhstan":"KZ","Latvia":"LV","Luxembourg":"LU","Moldova":"MD",
  "Netherlands":"NL","Norway":"NO","Philippines":"PH","Poland":"PL","Romania":"RO",
  "Russia":"RU","Saudi Arabia":"SA","Singapore":"SG","Slovakia":"SK",
  "South Africa":"ZA","Spain":"ES","Sweden":"SE","Switzerland":"CH","Taiwan":"TW",
  "Turkey":"TR","Ukraine":"UA","United Kingdom":"GB","United States":"US",
};
const flagOf = country => {
  const code = ISO[country];
  if (!code) return "";
  return String.fromCodePoint(...[...code].map(c => 0x1f1e6 + c.charCodeAt(0) - 65));
};

// отображение координат: корень показываем как "0" (в данных он "")
const dispC = c => c === "" ? "0" : c;

// ---------- язык (RU/EN) ----------

const I18N = {
  ru: {
    title: "Дерево публичных пиров Yggdrasil",
    changes: "изменения", flags: "флаги",
    changesTitle: "Подсветить пиры, сменившие координаты с предыдущего состояния",
    flagsTitle: "Показывать флаг страны вместо точки пира",
    search: "поиск", refresh: "Обновить", refreshTitle: "Обновить данные сейчас",
    peers: "пиров", live: "сейчас", dataAsOf: "данные на",
    root: "корень", changed: "изменилось", peer: "пир", dot: "точка",
    publicPeer: "публичный пир", noHistory: "истории пока нет",
    tPrev: "Предыдущее состояние (←)", tNext: "Следующее состояние (→)",
    tLive: "К последнему состоянию на таймлайне", tIn: "Приблизить", tOut: "Отдалить",
    tFit: "Вписать в экран", loading: "загрузка…", error: "ошибка загрузки",
  },
  en: {
    title: "Yggdrasil public peers tree",
    changes: "changes", flags: "flags",
    changesTitle: "Highlight peers that changed coordinates since the previous state",
    flagsTitle: "Show the country flag instead of the peer dot",
    search: "search", refresh: "Refresh", refreshTitle: "Refresh data now",
    peers: "peers", live: "live", dataAsOf: "data as of",
    root: "root", changed: "changed", peer: "peer", dot: "dot",
    publicPeer: "public peer", noHistory: "no history yet",
    tPrev: "Previous state (←)", tNext: "Next state (→)",
    tLive: "Jump to the latest timeline state", tIn: "Zoom in", tOut: "Zoom out",
    tFit: "Fit to screen", loading: "loading…", error: "failed to load",
  },
};
let LANG = "ru";
try {
  LANG = localStorage.getItem("ymonitor-lang") ||
         (navigator.language && navigator.language.toLowerCase().startsWith("ru") ? "ru" : "en");
} catch { /* приватный режим */ }
const T = () => I18N[LANG];
const LOC = () => (LANG === "ru" ? "ru-RU" : "en-GB");

// ---------- состояние ----------

let registry = new Map(); // key -> {ipv6, endpoints, country}
let cur = new Map();      // key -> coords (живое состояние из /v1/tree)
let events = [];          // журнал изменений, отсортирован по возрастанию ts
let points = [];          // уникальные ts с изменениями (ось таймлайна)
let counts = [];          // число событий на точку (объём на таймлайне)
let coordsIndex = new Map(); // coords -> key (последнее известное положение)
let stateCache = new Map();  // индекс точки -> Map(key -> coords)
let sel = null;           // выбранная точка таймлайна; null = живое состояние
let asOf = 0;

async function load() {
  const [treeRes, evRes] = await Promise.all([
    fetch(API_URL + "/v1/tree", { cache: "no-store" }),
    fetch(API_URL + "/v1/events?limit=200000", { cache: "no-store" }),
  ]);
  if (!treeRes.ok) throw new Error("tree: HTTP " + treeRes.status);
  if (!evRes.ok) throw new Error("events: HTTP " + evRes.status);
  const tree = await treeRes.json();
  const ev = await evRes.json();

  asOf = tree.as_of;
  registry = new Map(); cur = new Map();
  for (const p of tree.peers) {
    registry.set(p.key, { ipv6: p.ipv6, endpoints: p.endpoints || [], country: p.country || "" });
    cur.set(p.key, p.coords);
  }
  events = ev.events || [];
  points = []; counts = [];
  coordsIndex = new Map(); stateCache = new Map();
  for (const e of events) { // events уже по возрастанию ts
    if (!points.length || points[points.length - 1] !== e.ts) { points.push(e.ts); counts.push(0); }
    counts[counts.length - 1]++;
    if (e.new_coords) coordsIndex.set(e.new_coords, e.peer_key);
    else if (e.old_coords && coordsIndex.get(e.old_coords) === e.peer_key) { /* оставим прошлую */ }
  }
  for (const [k, c] of cur) coordsIndex.set(c, k);
  // последний столбик таймлайна и есть «сейчас»: последних данных свежее нет,
  // потокового обновления не существует — сразу выбираем его
  sel = points.length ? points.length - 1 : null;
}

// Состояние на i-й точке таймлайна: перемотка журнала вперёд до points[i].
// Всё считается в браузере — переключение истории не ходит в API.
function stateAtPoint(i) {
  if (stateCache.has(i)) return stateCache.get(i);
  const st = new Map();
  const limit = points[i];
  for (const e of events) {
    if (e.ts > limit) break;
    if (e.new_coords === null) st.delete(e.peer_key);
    else st.set(e.peer_key, e.new_coords);
  }
  stateCache.set(i, st);
  return st;
}

function currentState() { return sel === null ? cur : stateAtPoint(sel); }

// выбранная точка таймлайна; null только пока истории нет вообще
function selIndex() { return sel ?? 0; }
function selectIndex(i) {
  if (points.length === 0) { sel = null; }
  else { sel = Math.min(points.length - 1, Math.max(0, i)); }
  renderAll();
}

function prevDiff() { // состояние предыдущей точки для подсветки изменений
  if (points.length === 0 || sel === null || sel <= 0) return null;
  return stateAtPoint(sel - 1);
}

// ---------- построение дерева (как раньше, из префиксов координат) ----------

function buildNodes(state) {
  const nodes = new Map();
  const ensure = (id, depth) => {
    let n = nodes.get(id);
    if (!n) { n = { id, depth, children: new Map(), key: null, x: 0, y: 0 }; nodes.set(id, n); }
    return n;
  };
  ensure("", 0);
  for (const [key, coords] of state) {
    const parts = coords === "" ? [] : coords.split(".");
    let parent = nodes.get("");
    for (let i = 0; i < parts.length; i++) {
      const id = parts.slice(0, i + 1).join(".");
      const node = ensure(id, i + 1);
      parent.children.set(id, node);
      parent = node;
    }
    parent.key = key;
  }
  const last = id => id === "" ? -1 : parseInt(id.slice(id.lastIndexOf(".") + 1), 10);
  for (const n of nodes.values()) n.children = [...n.children.values()].sort((a, b) => last(a.id) - last(b.id));
  return nodes;
}

function layout(nodes) {
  const ROW = 26, COL = 160;
  let leaf = 0;
  const walk = n => {
    if (n.children.length === 0) n.y = leaf++ * ROW;
    else {
      for (const c of n.children) walk(c);
      n.y = (n.children[0].y + n.children[n.children.length - 1].y) / 2;
    }
    n.x = n.depth * COL;
  };
  walk(nodes.get(""));
}

// ---------- отрисовка карты ----------

let vb = null;        // текущий viewBox {x,y,w,h}
let lastNodes = null; // для «вписать в экран»

function apply() { if (vb) svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }

function fit(nodes) {
  const pad = 40;
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  vb = { x: Math.min(...xs) - pad, y: Math.min(...ys) - pad,
         w: Math.max(...xs) - Math.min(...xs) + pad * 2,
         h: Math.max(...ys) - Math.min(...ys) + pad * 2 };
  apply();
}

function renderMap() {
  const state = currentState();
  const prev = prevDiff();
  const diffOn = document.getElementById("opt-diff").checked && prev;
  const flagsOn = document.getElementById("opt-flags").checked;

  const nodes = buildNodes(state);
  layout(nodes);

  // глиф узла: флаг страны вместо точки у пиров (если включено и страна известна)
  const flagOfNode = n => (flagsOn && n.key !== null) ? flagOf(registry.get(n.key)?.country || "") : "";
  const glyphR = n => n.id === "" ? 6 : (n.key === null ? 3.5 : (flagOfNode(n) ? 9 : 5));

  let edges = "", glyphs = "", labels = "";
  for (const n of nodes.values()) {
    const isPeer = n.key !== null;
    const changed = diffOn && isPeer && prev.get(n.key) !== state.get(n.key);
    const k = n.id === "" ? "rootn" : changed ? "peerc" : (isPeer ? "peer" : "dot");
    const flag = flagOfNode(n);
    const r = glyphR(n);
    for (const c of n.children) {
      const cr = glyphR(c);
      const midX = (n.x + c.x) / 2;
      edges += `<path class="edge" d="M ${n.x + r} ${n.y} H ${midX} V ${c.y} H ${c.x - cr}"/>`;
    }
    if (flag) {
      glyphs += `<text class="flagnode" data-id="${n.id}" data-key="${n.key}" x="${n.x}" y="${n.y + 5}">${flag}</text>`;
    } else {
      glyphs += `<circle class="node ${k}" data-id="${n.id}" data-key="${n.key || ""}" cx="${n.x}" cy="${n.y}" r="${r}"/>`;
    }
    labels += `<text class="lbl ${k}" data-id="${n.id}" data-key="${n.key || ""}" x="${n.x + r + 6}" y="${n.y + 3.5}">${dispC(n.id)}</text>`;
  }
  svg.innerHTML = edges + glyphs + labels;

  // мета-строка
  const peers = [...state.entries()];
  let dmeta = "";
  if (prev) {
    let ap = 0, va = 0, mo = 0;
    for (const [k, c] of state) {
      if (!prev.has(k)) ap++;
      else if (prev.get(k) !== c) mo++;
    }
    for (const k of prev.keys()) if (!state.has(k)) va++;
    dmeta = ` · <b>+${ap}</b> <b>−${va}</b> <b>~${mo}</b>`;
  }
  const when = sel === null
    ? T().noHistory
    : new Date(points[sel] * 1000).toLocaleString(LOC());
  metaEl.innerHTML = `<b>${peers.length}</b> ${T().peers} · ${when}${dmeta}` +
    `<span class="legend"><i class="sw" style="background:#fbbf24"></i>${T().root}` +
    `<i class="sw" style="background:#fb923c"></i>${T().changed}` +
    `<i class="sw" style="background:#38bdf8"></i>${T().peer}` +
    `<i class="sw" style="background:#64748b"></i>${T().dot}</span>`;
  lastNodes = [...nodes.values()];
}

// ---------- таймлайн ----------

function renderTimeline() {
  const W = tlsvg.clientWidth || 600, H = 64, pad = 8;
  const i = selIndex(), n = points.length;
  let bars = "";
  if (n > 0) {
    const t0 = points[0], tN = points[n - 1];
    const span = Math.max(tN - t0, 1);
    const x = ts => pad + ((ts - t0) / span) * (W - 2 * pad);
    const maxC = Math.max(...counts, 1);
    const bw = Math.max(2, Math.min(7, (W - 2 * pad) / n * 0.6));
    for (let p = 0; p < n; p++) {
      const h = Math.max(2, (counts[p] / maxC) * (H - 18));
      const bx = n === 1 ? W / 2 : x(points[p]);
      const cls = p === i ? "selb" : "vb";
      bars += `<rect x="${bx - bw / 2}" y="${H - 6 - h}" width="${bw}" height="${h}" class="${cls}" data-p="${p}"/>`;
    }
    // маркер выбранного состояния
    if (i < n) {
      const mx = n === 1 ? W / 2 : x(points[i]);
      bars += `<line x1="${mx}" y1="2" x2="${mx}" y2="${H - 4}" class="mark"/>`;
    }
    // подписи краёв
    bars += `<text x="${pad}" y="10" class="axt">${fmtDate(points[0])}</text>`;
    bars += `<text x="${W - pad}" y="10" class="axt" text-anchor="end">${fmtDate(points[n - 1])}</text>`;
  } else {
    bars = `<text x="${W / 2}" y="${H / 2}" class="axt" text-anchor="middle">${T().noHistory}</text>`;
  }
  tlsvg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  tlsvg.innerHTML = bars;

  // за последним столбиком ничего нет — next и «сейчас» на нём гаснут
  const atLast = points.length === 0 || selIndex() >= points.length - 1;
  document.getElementById("prev").disabled = selIndex() === 0;
  document.getElementById("next").disabled = atLast;
  document.getElementById("golive").disabled = atLast;
}

function fmtDate(ts) {
  const d = new Date(ts * 1000);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  return sameDay ? d.toLocaleTimeString(LOC(), { hour: "2-digit", minute: "2-digit" })
                : d.toLocaleDateString(LOC(), { day: "2-digit", month: "2-digit" });
}

tlsvg.addEventListener("click", e => {
  const r = e.target.closest("rect[data-p]");
  if (r) { selectIndex(+r.dataset.p); return; }
  // клик по пустому месту: ближайшая точка по x
  const rect = tlsvg.getBoundingClientRect();
  const W = tlsvg.clientWidth, pad = 8;
  const n = points.length;
  if (n === 0) return;
  const frac = (e.clientX - rect.left - pad) / Math.max(W - 2 * pad, 1);
  const t0 = points[0], tN = points[n - 1];
  const target = t0 + frac * Math.max(tN - t0, 1);
  let best = 0, bd = Infinity;
  for (let p = 0; p < n; p++) {
    const d = Math.abs(points[p] - target);
    if (d < bd) { bd = d; best = p; }
  }
  selectIndex(best);
});

// ---------- зум/пан (мышь + тач) ----------

// перерисовку вида сводим к одному разу на кадр — пан не отстаёт от мыши
let rafPending = false;
function scheduleApply() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; apply(); });
}

function svgPoint(x, y) {
  const pt = svg.createSVGPoint();
  pt.x = x; pt.y = y;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function zoomAt(cx, cy, k) {
  const p = svgPoint(cx, cy);
  vb = { x: p.x - (p.x - vb.x) * k, y: p.y - (p.y - vb.y) * k, w: vb.w * k, h: vb.h * k };
  apply();
}

let svgRect = null; // кэш размеров на время жеста
// Настоящий масштаб px -> единицы viewBox берём из CTM: он учитывает
// preserveAspectRatio. При «высоком» дереве в широком окне возникает
// леттербоксинг, отношения vb.w/width и vb.h/height различаются, и пан по
// одной из осей ехал медленнее мыши.
function vbScale() {
  const m = svg.getScreenCTM();
  return { kx: 1 / m.a, ky: 1 / m.d };
}
function panBy(dx, dy) {
  const s = vbScale();
  vb = { ...vb, x: vb.x - dx * s.kx, y: vb.y - dy * s.ky };
  scheduleApply();
}

svg.addEventListener("wheel", e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1 / 1.08 : 1.08);
}, { passive: false });

const pointers = new Map();
let panStart = null, pinchPrev = null, dragged = false;
let lastTap = null;  // {x, y, t} последнего короткого тапа — для жеста зума
let zoomDrag = null; // активный жест «тап — тап+удержание — вверх/вниз»

function pinchInfo() {
  const [a, b] = [...pointers.values()];
  return { dist: Math.hypot(a.x - b.x, a.y - b.y) || 1,
           mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 } };
}

svg.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  dragged = false;
  svg.classList.add("panning");
  if (!svgRect) svgRect = svg.getBoundingClientRect();
  if (pointers.size === 1) {
    // жест как на Яндекс/Google картах: тап, затем быстрое нажатие рядом
    // без отпускания — и движение вверх/вниз зумит карту
    if (lastTap && performance.now() - lastTap.t < 350 &&
        Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 45) {
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      zoomDrag = { y0: e.clientY, ax: p.x, ay: p.y, vb: { ...vb } };
      dragged = true; // жест не должен открывать карточку
      hideCard();
      lastTap = null;
      panStart = null;
      return;
    }
    const s = vbScale();
    panStart = { x: e.clientX, y: e.clientY, vb: { ...vb }, kx: s.kx, ky: s.ky };
    pinchPrev = null;
  } else if (pointers.size === 2) { panStart = null; pinchPrev = pinchInfo(); }
});
window.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (zoomDrag && pointers.size === 1) {
    // вниз = приблизить, вверх = отдалить; коэффициент считается от
    // начального вида жеста, без накопления ошибки
    const k = Math.exp((zoomDrag.y0 - e.clientY) / 250);
    vb = { x: zoomDrag.ax - (zoomDrag.ax - zoomDrag.vb.x) * k,
           y: zoomDrag.ay - (zoomDrag.ay - zoomDrag.vb.y) * k,
           w: zoomDrag.vb.w * k, h: zoomDrag.vb.h * k };
    scheduleApply();
  } else if (pointers.size === 1 && panStart) {
    const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) dragged = true;
    vb = { ...panStart.vb, x: panStart.vb.x - dx * panStart.kx, y: panStart.vb.y - dy * panStart.ky };
    scheduleApply();
  } else if (pointers.size >= 2 && pinchPrev) {
    const ci = pinchInfo();
    const k = pinchPrev.dist / ci.dist;
    if (Math.abs(k - 1) > 0.001) zoomAt(ci.mid.x, ci.mid.y, k);
    panBy(ci.mid.x - pinchPrev.mid.x, ci.mid.y - pinchPrev.mid.y);
    if (Math.abs(k - 1) > 0.01) dragged = true;
    pinchPrev = ci;
  }
});
function releasePointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    svg.classList.remove("panning");
    svgRect = null;
    zoomDrag = null;
    if (!dragged) lastTap = { x: e.clientX, y: e.clientY, t: performance.now() };
  } else if (pointers.size === 1) {
    const [p] = [...pointers.values()];
    const s = vbScale();
    panStart = { x: p.x, y: p.y, vb: { ...vb }, kx: s.kx, ky: s.ky };
    pinchPrev = null;
    zoomDrag = null;
  }
}
window.addEventListener("pointerup", releasePointer);
window.addEventListener("pointercancel", releasePointer);
window.addEventListener("resize", () => { svgRect = null; });

// двойной тап/клик — приблизить в месте нажатия (вписать в экран — кнопка ⤢)
svg.addEventListener("dblclick", e => {
  hideCard();
  zoomAt(e.clientX, e.clientY, 1 / 1.7);
});
document.getElementById("zin").addEventListener("click", () =>
  zoomAt(window.innerWidth / 2, window.innerHeight / 2, 1 / 1.3));
document.getElementById("zout").addEventListener("click", () =>
  zoomAt(window.innerWidth / 2, window.innerHeight / 2, 1.3));
document.getElementById("zfit").addEventListener("click", () => { if (lastNodes) fit(lastNodes); });

// ---------- тултип ----------

svg.addEventListener("pointermove", e => {
  const t = e.target.closest("circle.node, text.flagnode");
  if (!t || pointers.size > 0) { tipEl.style.display = "none"; return; }
  tipEl.textContent = `${dispC(t.dataset.id)} — ` +
    (t.dataset.id === "" ? T().root : t.classList.contains("dot") ? T().dot : T().publicPeer);
  tipEl.style.display = "block";
  tipEl.style.left = e.clientX + 14 + "px";
  tipEl.style.top = e.clientY + 14 + "px";
});
svg.addEventListener("pointerleave", () => tipEl.style.display = "none");

// ---------- карточка пира (полностью локальная) ----------

function hideCard() { cardEl.style.display = "none"; }

function placeCard(x, y) {
  cardEl.style.display = "block";
  const w = Math.min(360, window.innerWidth - 16);
  cardEl.style.maxWidth = w + "px";
  const left = Math.max(8, Math.min(x + 14, window.innerWidth - w - 8));
  const top = Math.max(8, Math.min(y + 14, window.innerHeight - cardEl.offsetHeight - 8));
  cardEl.style.left = left + "px";
  cardEl.style.top = top + "px";
}

function showCard(key, coords, x, y) {
  const r = registry.get(key);
  if (!r) return;
  const flag = flagOf(r.country);
  cardEl.innerHTML =
    `<h3>${dispC(coords)}</h3>` +
    (r.country ? `<div class="cty">${flag ? flag + " " : ""}${r.country}</div>` : "") +
    `<div class="v6">${r.ipv6}</div>` +
    `<div class="pk">${key}</div>` +
    `<ul>${r.endpoints.map(u => `<li>${u}</li>`).join("")}</ul>`;
  placeCard(x, y);
}

svg.addEventListener("click", e => {
  const t = e.target.closest("circle.node, text.lbl, text.flagnode");
  if (!t || dragged) return;
  if (!t.dataset.key) { hideCard(); return; }
  showCard(t.dataset.key, t.dataset.id, e.clientX, e.clientY);
});

// ---------- поиск ----------

const qEl = document.getElementById("q");
const resEl = document.getElementById("results");

function searchIndex() {
  const out = [];
  for (const [k, v] of registry) {
    out.push({ tag: "key", text: k, key: k });
    out.push({ tag: "ipv6", text: v.ipv6, key: k });
    for (const u of v.endpoints) out.push({ tag: "адрес", text: u, key: k });
    if (v.country) out.push({ tag: "страна", text: v.country, key: k });
  }
  for (const [c, k] of coordsIndex) out.push({ tag: "coords", text: dispC(c), key: k, coords: c });
  return out;
}

function runSearch(q) {
  q = q.trim().toLowerCase();
  resEl.innerHTML = "";
  if (!q.length) { resEl.style.display = "none"; return; }
  let exact = coordsIndex.has(q) ? q : null;
  if (exact === null && q === "0" && coordsIndex.has("")) exact = ""; // корень
  const hits = searchIndex().filter(it => it.text.toLowerCase().includes(q)).slice(0, 30);
  if (exact !== null) {
    // полное совпадение координат — сразу прыжок к ноде
    jumpTo(coordsIndex.get(exact), exact);
    if (hits.length) showResults(hits);
    else resEl.style.display = "none";
    return;
  }
  if (hits.length) showResults(hits); else resEl.style.display = "none";
}

function showResults(hits) {
  resEl.innerHTML = hits.map((h, i) =>
    `<div data-i="${i}"><span class="tag">${h.tag}</span>${h.text}</div>`).join("");
  resEl.style.display = "block";
  resEl._hits = hits;
}

resEl.addEventListener("click", e => {
  const d = e.target.closest("div[data-i]");
  if (!d) return;
  const h = resEl._hits[+d.dataset.i];
  resEl.style.display = "none";
  const st = currentState();
  if (h.coords !== undefined) jumpTo(h.key, h.coords);
  else jumpTo(h.key, st.get(h.key));
});

qEl.addEventListener("input", () => runSearch(qEl.value));
qEl.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const q = qEl.value.trim().toLowerCase();
    const hit = (resEl._hits || []).find(h => h.text.toLowerCase() === q) ||
                searchIndex().find(it => it.text.toLowerCase() === q);
    if (hit) {
      resEl.style.display = "none";
      const st = currentState();
      jumpTo(hit.key, hit.coords !== undefined ? hit.coords : st.get(hit.key));
    }
  } else if (e.key === "Escape") { resEl.style.display = "none"; qEl.blur(); }
});

// прыжок к ноде: выбрать состояние, где нода в этих координатах, центрировать и подсветить
function jumpTo(key, coords) {
  if (coords === undefined || coords === null) return;
  let target = points.length - 1; // не нашли в истории — последнее состояние
  for (let i = points.length - 1; i >= 0; i--) {
    if (stateAtPoint(i).get(key) === coords) { target = i; break; }
  }
  if (sel !== target) { sel = target; renderAll(); }
  highlight(coords);
}

let hlTimer = null;
function highlight(coords) {
  const el = svg.querySelector(`circle.node[data-id="${CSS.escape(coords)}"], text.flagnode[data-id="${CSS.escape(coords)}"]`);
  if (!el) return;
  const cx = +(el.getAttribute("cx") ?? el.getAttribute("x"));
  const cy = +(el.getAttribute("cy") ?? el.getAttribute("y"));
  // центрируем окно на ноде
  const rect = svg.getBoundingClientRect();
  const w = Math.max(500, vb.w / 2.5), h = w * (rect.height / rect.width);
  vb = { x: cx - w / 2, y: cy - h / 2, w, h };
  apply();
  const old = svg.querySelector("circle.hl");
  if (old) old.remove();
  const hl = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  hl.setAttribute("class", "hl");
  hl.setAttribute("cx", cx); hl.setAttribute("cy", cy); hl.setAttribute("r", 14);
  svg.appendChild(hl);
  clearTimeout(hlTimer);
  hlTimer = setTimeout(() => hl.remove(), 4000);
}

// ---------- переключатели, клавиатура, жизненный цикл ----------

// опции карты: состояние переживает перезагрузку (localStorage)
const optDiffEl = document.getElementById("opt-diff");
const optFlagsEl = document.getElementById("opt-flags");
try {
  const saved = JSON.parse(localStorage.getItem("ymonitor-opts") || "{}");
  if (typeof saved.diff === "boolean") optDiffEl.checked = saved.diff;
  if (typeof saved.flags === "boolean") optFlagsEl.checked = saved.flags;
} catch { /* приватный режим — живём с дефолтами */ }
const saveOpts = () => {
  try { localStorage.setItem("ymonitor-opts", JSON.stringify({ diff: optDiffEl.checked, flags: optFlagsEl.checked })); } catch {}
};
optDiffEl.addEventListener("change", () => { saveOpts(); renderMap(); });
optFlagsEl.addEventListener("change", () => { saveOpts(); renderMap(); });
document.getElementById("prev").addEventListener("click", () => selectIndex(selIndex() - 1));
document.getElementById("next").addEventListener("click", () => selectIndex(selIndex() + 1));
// «сейчас» = последний столбик таймлайна (если истории ещё нет — живое состояние)
document.getElementById("golive").addEventListener("click", () => selectIndex(points.length - 1));

document.addEventListener("keydown", e => {
  if (e.target === qEl) return;
  // Ctrl/Cmd+F (в т.ч. русская раскладка — «а») и "/" — фокус в наш поиск
  // вместо браузерного поиска по странице
  if ((e.ctrlKey || e.metaKey) && ["f", "F", "а", "А"].includes(e.key)) {
    e.preventDefault();
    qEl.focus();
    qEl.select();
    return;
  }
  if (e.key === "/") {
    e.preventDefault();
    qEl.focus();
    return;
  }
  if (e.key === "ArrowLeft") selectIndex(selIndex() - 1);
  else if (e.key === "ArrowRight") selectIndex(selIndex() + 1);
  else if (e.key === "Escape") hideCard();
});
document.addEventListener("click", e => {
  if (!e.target.closest("#card") && !e.target.closest("#controls") &&
      !e.target.closest("circle.node") && !e.target.closest("text.lbl") &&
      !e.target.closest("text.flagnode") && !e.target.closest("#search")) hideCard();
});

let needFit = true;
function renderAll() { renderMap(); renderTimeline(); }

// применяем язык ко всем статичным строкам и перерисовываем динамику
function applyLang() {
  const t = T();
  document.documentElement.lang = LANG;
  document.title = t.title;
  document.getElementById("h1").textContent = t.title;
  document.getElementById("lbl-diff").textContent = t.changes;
  document.getElementById("lbl-diff-box").title = t.changesTitle;
  document.getElementById("lbl-flags").textContent = t.flags;
  document.getElementById("lbl-flags-box").title = t.flagsTitle;
  document.getElementById("q").placeholder = t.search;
  const r = document.getElementById("refresh");
  r.textContent = t.refresh; r.title = t.refreshTitle;
  document.getElementById("golive").textContent = t.live;
  document.getElementById("prev").title = t.tPrev;
  document.getElementById("next").title = t.tNext;
  document.getElementById("golive").title = t.tLive;
  document.getElementById("zin").title = t.tIn;
  document.getElementById("zout").title = t.tOut;
  document.getElementById("zfit").title = t.tFit;
  document.getElementById("lang").textContent = LANG === "ru" ? "EN" : "RU";
  renderAll();
}
document.getElementById("lang").addEventListener("click", () => {
  LANG = LANG === "ru" ? "en" : "ru";
  try { localStorage.setItem("ymonitor-lang", LANG); } catch {}
  applyLang();
});
applyLang();

async function refresh() {
  try {
    await load();
    renderAll();
    // вписываем дерево в экран при первом появлении данных; applyLang и
    // автообновления вид не сбрасывают (needFit гасится только здесь)
    if (needFit && lastNodes && lastNodes.length > 1) { fit(lastNodes); needFit = false; }
  } catch (err) {
    metaEl.innerHTML = `<span id="err">${T().error}: ${err.message}</span>`;
  }
}

document.getElementById("refresh").addEventListener("click", refresh);
let rsz;
window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(renderTimeline, 150); });
refresh();
setInterval(refresh, REFRESH_MS);

// стили, которые удобнее задать из JS-констант (timeline)
const tlCss = document.createElement("style");
tlCss.textContent = `
  #tlsvg rect.vb  { fill: #334155; }
  #tlsvg rect.selb{ fill: #38bdf8; }
  #tlsvg rect.vb:hover { fill: #475569; }
  #tlsvg line.mark { stroke: #38bdf8; stroke-width: 1.5; stroke-dasharray: 3 2; }
  #tlsvg text.axt { fill: #475569; font-size: 9px; font-family: ui-monospace, monospace; }
`;
document.head.appendChild(tlCss);
</script>
